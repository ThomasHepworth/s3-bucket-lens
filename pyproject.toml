[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "s3-bucket-lens"
version = "0.1.0"
description = "An offline, DuckDB-backed S3 storage and cost explorer."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Tom Hepworth" }]
dependencies = ["boto3>=1.35,<2", "duckdb>=1.4,<2", "ijson>=3.3,<4", "pytz>=2025.1"]

[project.scripts]
s3-bucket-lens = "s3_bucket_lens.cli:main"
bucket-lens = "s3_bucket_lens.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/s3_bucket_lens"]

[tool.hatch.build.targets.wheel.force-include]
"src/data/pricing.json" = "s3_bucket_lens/data/pricing.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]